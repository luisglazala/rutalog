<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="./boot.css">
<script src="./boot.js"></script>
<style id="rutalog-boot-css">
html,body{background:#0a0a0a!important}
html:not(.rutalog-ready) .app{visibility:hidden!important;opacity:0!important;pointer-events:none!important}
html.rutalog-need-login #loginOverlay{display:flex!important;visibility:visible!important;pointer-events:auto!important;position:fixed!important;inset:0!important;z-index:99999!important;background:#0a0a0a!important;align-items:center!important;justify-content:center!important;padding:24px!important}
html.rutalog-need-login #loginOverlay[hidden]{display:flex!important;visibility:visible!important}
</style>
<script>
(function(){try{var hasSession=false;try{var raw=localStorage.getItem("rutalog_session");if(raw){var u=JSON.parse(raw);if(u&&u.id&&u.username)hasSession=true}}catch(e){}var needLogin=false;try{var usersRaw=localStorage.getItem("rutalog_usuarios_v2");var users=usersRaw?JSON.parse(usersRaw):[];if(Array.isArray(users)&&users.some(function(x){return x&&x.activo!==false}))needLogin=!hasSession}catch(e){}if(needLogin)document.documentElement.classList.add("rutalog-need-login");else if(hasSession)document.documentElement.classList.add("rutalog-ready");else document.documentElement.classList.add("rutalog-booting")}catch(e){document.documentElement.classList.add("rutalog-booting")}})();
</script>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5, user-scalable=yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>RUTALOG — Consolidador Territorial · Lazala</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Cpath d='M8 22 L16 7 L24 22' fill='none' stroke='%23fafafa' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='20' r='2.2' fill='%23fafafa'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<link rel="stylesheet" href="./styles.css?v=final3">
<link rel="stylesheet" href="./mejoras-v2.css?v=11">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0a0a0a">
</head>
<body>
<script>
(function(){
  var BODY_SRC = "https://cdn.jsdelivr.net/gh/luisglazala/rutalog@dbb313fbe86246228841486f56cd0c9b141f4354/RUTALOG%20GITHUB.html";
  function loadScript(src){
    return new Promise(function(resolve,reject){
      var s=document.createElement("script");
      s.src=src;
      s.onload=function(){resolve();};
      s.onerror=function(){reject(new Error("fail "+src));};
      document.head.appendChild(s);
    });
  }
  function bootSessionClasses(){
    try{
      var hasSession=false;
      try{var raw=localStorage.getItem("rutalog_session");if(raw){var u=JSON.parse(raw);if(u&&u.id&&u.username)hasSession=true}}catch(e){}
      var needLogin=false;
      try{var usersRaw=localStorage.getItem("rutalog_usuarios_v2");var users=usersRaw?JSON.parse(usersRaw):[];if(Array.isArray(users)&&users.some(function(x){return x&&x.activo!==false}))needLogin=!hasSession}catch(e){}
      document.documentElement.classList.remove("rutalog-ready","rutalog-need-login","rutalog-booting");
      if(needLogin) document.documentElement.classList.add("rutalog-need-login");
      else if(hasSession) document.documentElement.classList.add("rutalog-ready");
      else document.documentElement.classList.add("rutalog-booting");
    }catch(e){}
  }
  function removeDiaButtons(root){
    ["btnExportSesion","btnImportSesion","fileImportSesion"].forEach(function(id){
      var n = root.getElementById ? root.getElementById(id) : null;
      if(n && n.parentNode) n.parentNode.removeChild(n);
    });
  }
  function mountBody(html){
    var parser=new DOMParser();
    var doc=parser.parseFromString(html,"text/html");
    removeDiaButtons(doc);
    var bodyHtml=doc.body?doc.body.innerHTML:html;
    document.body.insertAdjacentHTML("beforeend", bodyHtml);
    Array.prototype.slice.call(document.body.querySelectorAll("script")).forEach(function(s){
      if(!s.src) return;
      if(s.src.indexOf("boot.js")!==-1) return;
      if(s.src.indexOf("app.js")!==-1 || s.src.indexOf("leaflet")!==-1 || s.src.indexOf("xlsx")!==-1 || s.src.indexOf("sheetjs")!==-1){
        s.remove();
      }
    });
    removeDiaButtons(document);
    bootSessionClasses();
    var s=document.createElement("script");
    s.src="./app.js?v=final3";
    s.defer=true;
    s.onerror=function(){ console.error("[RUTALOG] app.js fail"); };
    document.body.appendChild(s);
  }
  Promise.resolve()
  .then(function(){ return loadScript("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"); })
  .then(function(){ return loadScript("https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"); })
  .then(function(){ return loadScript("https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"); })
  .then(function(){
    return fetch(BODY_SRC,{cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("HTTP body "+r.status);
      return r.text();
    });
  })
  .then(mountBody)
  .catch(function(err){
    document.body.innerHTML='<p style="color:#fafafa;font-family:system-ui;padding:2rem">Error al cargar. <small style="color:#a3a3a3">'+err+'</small></p>';
  });
})();
</script>
</body>
</html>
