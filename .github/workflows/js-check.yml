name: RUTALOG checks
on:
  push:
  pull_request:
    branches: [main]
jobs:
  unit-and-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check all JS and MJS
        run: |
          set -e
          count=0
          fail=0
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort > /tmp/jsfiles.txt
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            count=$((count+1))
            if ! node --check "$f" 2>/tmp/nc.err; then
              echo "FAIL $f"
              cat /tmp/nc.err || true
              fail=$((fail+1))
            fi
          done < /tmp/jsfiles.txt
          echo "Checked $count files, failures $fail"
          test "$count" -gt 0
          test "$fail" -eq 0
      - name: Integridad shell/index
        run: |
          set -e
          SZ=$(wc -c < shell-body.html | tr -d ' ')
          test "$SZ" -ge 30000
          grep -q loginOverlay shell-body.html
          ISZ=$(wc -c < index.html | tr -d ' ')
          test "$ISZ" -ge 4000
          if grep -R --include='*.html' --include='*.js' --exclude=sw.js --exclude-dir=tests --exclude-dir=.git -nE 'RESTORE_MARKER|content too large for single tool' . ; then
            echo "FAIL: placeholder encontrado"
            exit 1
          fi
          echo "Integridad OK shell=$SZ index=$ISZ"
      - name: Manifiesto docs/INTEGRIDAD.json
        run: |
          set -e
          node -e '
            const fs=require("fs"); const crypto=require("crypto");
            const manPath="docs/INTEGRIDAD.json";
            if (!fs.existsSync(manPath)) { console.log("WARN: no hay INTEGRIDAD.json"); process.exit(0); }
            const man=JSON.parse(fs.readFileSync(manPath,"utf8"));
            let hard=0, soft=0;
            const next={};
            for (const [f,meta] of Object.entries(man)) {
              if (!fs.existsSync(f)) { console.log("MISSING", f); hard++; continue; }
              const b=fs.readFileSync(f);
              const sz=b.length;
              const h=crypto.createHash("sha256").update(b).digest("hex");
              next[f]={bytes:sz, sha256:h};
              if (meta.bytes && sz < meta.bytes * 0.5) {
                console.log("SHRINK>50%", f, "was", meta.bytes, "now", sz);
                hard++;
              } else if (h !== meta.sha256) {
                console.log("HASH_DRIFT (ok, no falla CI)", f, "was", meta.bytes, "now", sz);
                soft++;
              } else {
                console.log("OK", f, sz);
              }
            }
            if (soft) {
              console.log("INFO:", soft, "archivo(s) con hash distinto al manifiesto (normal tras un fix).");
              console.log("Para actualizar el manifiesto en el repo: recalcular docs/INTEGRIDAD.json");
            }
            if (hard) { console.log("FAIL integridad dura:", hard); process.exit(1); }
            console.log("Integridad OK (hard=0 soft="+soft+")");
          '
      - name: Unit tests
        run: |
          set -e
          node tests/unit/sync-read-protection.test.mjs
          node tests/unit/proxy-preview-writes.test.mjs
          node tests/unit/sw-broken-cache.test.mjs
      - name: Proxy entry no logica propia
        run: |
          set -e
          if grep -E 'pathAllowed|handleGitHubProxy|ALLOWED_REPO' _worker.js; then
            echo "FAIL _worker.js contiene logica propia"
            exit 1
          fi
          grep -q 'from "./worker.js"' _worker.js
          echo "_worker.js OK reexport"
      - name: Sin secretos obvios en cliente
        run: |
          set -e
          if grep -RIn --include='*.js' --include='*.html' --exclude-dir=.git --exclude-dir=tests \
            -E 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' . ; then
            echo "FAIL: posible PAT en repo"
            exit 1
          fi
          echo "OK sin PAT literales"
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Playwright e2e (best effort)
        run: |
          npm init -y
          npm i -D playwright-core@1.49.0 || true
          node tests/e2e/shell-login.spec.mjs || echo "e2e skip/fail (continue-on-error)"
