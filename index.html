<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="./boot.css?v=7">
<script src="./boot.js?v=4"></script>
<script src="./debug-perf.js?v=1"></script>
<style id="rutalog-boot-css">
html,body{background:#0a0a0a!important;height:100%;margin:0;color:#f5f5f5}
html.rutalog-booting .app,html.rutalog-booting .sidebar,html.rutalog-booting .main,html.rutalog-booting .topbar,html:not(.rutalog-ready):not(.rutalog-need-login) .app,html:not(.rutalog-ready):not(.rutalog-need-login) .sidebar,html:not(.rutalog-ready):not(.rutalog-need-login) .main,html:not(.rutalog-ready):not(.rutalog-need-login) .topbar,html.rutalog-session-pending .app,html.rutalog-session-pending .sidebar,html.rutalog-session-pending .main,html.rutalog-session-pending .topbar{visibility:hidden!important;opacity:0!important;pointer-events:none!important}
html.rutalog-session-pending #loginOverlay{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}
html.rutalog-need-login:not(.rutalog-session-pending) .sidebar,html.rutalog-need-login:not(.rutalog-session-pending) .main,html.rutalog-need-login:not(.rutalog-session-pending) .topbar{visibility:hidden!important;opacity:0!important;pointer-events:none!important}
html.rutalog-need-login:not(.rutalog-session-pending) #loginOverlay{display:flex!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;position:fixed!important;inset:0!important;z-index:99999!important;background:#0a0a0a!important;align-items:center!important;justify-content:center!important;padding:24px!important}
.leaflet-div-icon,.leaflet-marker-icon.leaflet-div-icon{background:transparent!important;border:none!important}
.app{display:flex!important;flex-direction:row!important;height:100vh!important;overflow:hidden!important}
/* Limpiar día / Viajes solo dentro del menú Día ▾ */
.topbar > #btnLimpiarDia,.topbar > #btnBorrarViajesTop{display:none!important;visibility:hidden!important}
.ui-day-dropdown #btnLimpiarDia,.ui-day-dropdown #btnBorrarViajesTop{display:inline-flex!important;visibility:visible!important}
</style>
<script>(function(){try{var d=document.documentElement;d.classList.add("rutalog-booting");var ok=false;try{var r=localStorage.getItem("rutalog_session");if(r){var u=JSON.parse(r);if(u&&u.id&&u.username)ok=true}}catch(e){}if(ok){d.classList.add("rutalog-session-pending");d.classList.remove("rutalog-need-login")}else{d.classList.add("rutalog-need-login");d.classList.remove("rutalog-session-pending")}}catch(e){document.documentElement.classList.add("rutalog-booting","rutalog-need-login")}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RUTALOG — Consolidador Territorial · Lazala</title>
<link rel="icon" href="./favicon.svg?v=1" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<link rel="stylesheet" href="./styles.css?v=fase0-2">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<script>window.RUTALOG_API_BASE="https://rutalog.pages.dev/api";</script>
<script src="./mejoras-gh-proxy.js?v=4"></script>
<script src="./mejoras-login-inmediato.js?v=10"></script>
<script src="./mejoras-storage.js?v=1"></script>
</head>
<body>
<script>
(function(){
  var SRC='./shell-body.html?v=capa2';
  function loadScript(src){
    return new Promise(function(resolve,reject){
      var s=document.createElement('script');
      s.src=src;
      s.onload=function(){resolve();};
      s.onerror=function(){reject(new Error(src));};
      document.head.appendChild(s);
    });
  }
  function strip(html){
    html=html.replace(/<button[^>]*id=["']btnExportSesion["'][^>]*>[\s\S]*?<\/button>/gi,'');
    html=html.replace(/<button[^>]*id=["']btnImportSesion["'][^>]*>[\s\S]*?<\/button>/gi,'');
    html=html.replace(/<input[^>]*id=["']fileImportSesion["'][^>]*>/gi,'');
    return html;
  }
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js')
  .then(function(){ return loadScript('https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js'); })
  .then(function(){ return loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); })
  .then(function(){ return fetch(SRC,{cache:'no-store'}).then(function(r){return r.text();}); })
  .then(function(html){
    html=strip(html);
    var parser=new DOMParser();
    var doc=parser.parseFromString(html,'text/html');
    document.body.innerHTML=doc.body.innerHTML;
    Array.prototype.slice.call(document.querySelectorAll('script')).forEach(function(s){
      if(!s.src) return;
      if(s.src.indexOf('app.js')!==-1 || s.src.indexOf('leaflet')!==-1 || s.src.indexOf('xlsx')!==-1) s.remove();
    });
    try{
      var hasSession=false;
      try{var raw=localStorage.getItem('rutalog_session');if(raw){var u=JSON.parse(raw);if(u&&u.id&&u.username)hasSession=true}}catch(e){}
      var d=document.documentElement;
      d.classList.remove('rutalog-ready');
      d.classList.add('rutalog-booting');
      if(hasSession){d.classList.add('rutalog-session-pending');d.classList.remove('rutalog-need-login');}
      else{d.classList.add('rutalog-need-login');d.classList.remove('rutalog-session-pending');}
    }catch(e){}
    var sLoader=document.createElement('script');
    sLoader.src='./rutalog-loader.js?v=1';
    sLoader.onload=function(){
    var s=document.createElement('script');
    s.src='./app.js?v=flash11?v=session16';
    document.body.appendChild(s);
    };
    document.body.appendChild(sLoader);
  }).catch(function(err){
    document.body.innerHTML='<p style="color:#fafafa;font-family:system-ui;padding:2rem">Error al cargar. <a style="color:#60a5fa" href="'+SRC+'">Abrir respaldo</a></p>';
  });
})();
</script>
</body>
</html>
